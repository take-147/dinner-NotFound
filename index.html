<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dinner NotFound</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      color: #2c2520;
      min-height: 100vh;
      background-color: #faf7f2;
    }

    /* ▼ ヘッダー ▼ */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background-color: #ffffff;
      border-bottom: 2px solid #efeae2;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .hamburger-wrapper {
      position: relative;
      z-index: 200;
    }

    .menu-btn,
    .setting-btn {
      width: 44px;
      height: 44px;
      font-size: 1.25rem;
      border: 2px solid #e6dfd5;
      border-radius: 12px;
      background: #ffffff;
      color: #3d332c;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.15s ease;
    }

    .menu-btn:hover,
    .setting-btn:hover {
      background: #fff8eb;
      border-color: #f59e0b;
    }

    /* ハンバーガーのポップアップ箱 */
    .nav-popup {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      padding-top: 8px;
      min-width: 220px;
      z-index: 201;
    }

    .hamburger-wrapper:hover .nav-popup,
    .hamburger-wrapper.open .nav-popup {
      display: block;
    }

    .nav-popup-box {
      background-color: #ffffff;
      border: 2px solid #e6dfd5;
      border-radius: 14px;
      box-shadow: 0 10px 24px rgba(61, 51, 44, 0.12);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .nav-popup-item {
      display: block;
      padding: 14px 18px;
      text-decoration: none;
      color: #2c2520;
      font-size: 0.92rem;
      font-weight: bold;
      border-bottom: 1px solid #f4efe8;
      transition: background-color 0.15s;
    }

    .nav-popup-item:last-child {
      border-bottom: none;
    }

    .nav-popup-item:hover {
      background-color: #fff8eb;
      color: #b45309;
    }

    /* タイトルロゴ */
    .title-logo {
      font-size: 1.38rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #2c2520;
    }

    /* アレルギー設定中ステータス */
    .allergy-banner {
      display: none;
      width: 88%;
      max-width: 460px;
      margin: 20px auto -10px;
      padding: 10px 16px;
      background: #fff5f5;
      border: 1.5px solid #feb2b2;
      border-radius: 12px;
      color: #c53030;
      font-size: 0.82rem;
      font-weight: bold;
    }
    .allergy-banner.active {
      display: block;
    }

    /* ▼ メインメニュー ▼ */
    .menu-area {
      width: 88%;
      max-width: 460px;
      margin: 34px auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .menu-btn-large {
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 102px;
      padding: 0 24px;
      background: #ffffff;
      border: 2px solid #efeae2;
      border-left: 7px solid #f59e0b; /* マスタードイエロー */
      border-radius: 16px;
      text-decoration: none;
      color: #2c2520;
      box-shadow: 0 4px 0 #e8e1d7;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .menu-btn-large.recipe-card-theme {
      border-left-color: #e05a47; /* 食欲をそそるトマトオレンジ */
    }

    .menu-btn-large.knowledge-card-theme {
      border-left-color: #3f8f5c; /* フレッシュなレタスグリーン */
    }

    .menu-btn-large:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #dfd6c9;
      border-color: #dfd6c9;
    }

    .menu-btn-large:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #e8e1d7;
    }

    .menu-text-title {
      font-size: 1.28rem;
      font-weight: 800;
      color: #2c2520;
    }

    .menu-text-desc {
      font-size: 0.83rem;
      color: #73665c;
      margin-top: 4px;
    }

    /* ▼ アレルギー設定モーダル ▼ */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(44, 37, 32, 0.45);
      backdrop-filter: blur(3px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .setting-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border: 2px solid #efeae2;
      border-radius: 18px;
      box-shadow: 0 18px 32px rgba(44, 37, 32, 0.18);
      overflow: hidden;
    }

    .setting-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: #fff9ed;
      border-bottom: 1.5px solid #f5e6c8;
    }

    .setting-card-header h2 {
      font-size: 1.02rem;
      font-weight: bold;
      color: #7c4a03;
    }

    .close-card-btn {
      width: 32px;
      height: 32px;
      border: 1.5px solid #e6dfd5;
      background: #ffffff;
      border-radius: 10px;
      font-size: 1.2rem;
      color: #73665c;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-card-btn:hover {
      background: #faf7f2;
      color: #2c2520;
    }

    .setting-card-body {
      padding: 20px;
    }

    .setting-desc {
      font-size: 0.84rem;
      color: #5c5047;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .allergy-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .allergy-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1.5px solid #efeae2;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #2c2520;
      user-select: none;
      transition: all 0.15s;
    }

    .allergy-item:hover {
      background: #faf7f2;
    }

    .allergy-item:has(input:checked) {
      background: #fff5f5;
      border-color: #fc8181;
      color: #c53030;
      font-weight: bold;
    }

    .allergy-item input {
      accent-color: #e53e3e;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .save-setting-btn {
      width: 100%;
      padding: 13px;
      background: #3f8f5c;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #2e6d45;
      transition: background-color 0.15s;
    }

    .save-setting-btn:hover {
      background: #357a4e;
    }
  </style>
</head>

<body>

  <header>
    <!-- 左：ハンバーガーメニュー -->
    <div class="hamburger-wrapper" id="hamburger-wrapper">
      <button type="button" class="menu-btn" id="hamburger-btn" aria-label="メニュー">☰</button>
      <div class="nav-popup">
        <div class="nav-popup-box">
          <a href="test5.html" class="nav-popup-item">アキネーターモードに行く</a>
          <a href="recipe.html" class="nav-popup-item">レシピモードに行く</a>
        </div>
      </div>
    </div>

    <!-- 中央：タイトルロゴ -->
    <div class="title-logo">Dinner NotFound</div>

    <!-- 右：アレルギー設定ボタン -->
    <button type="button" class="setting-btn" id="open-setting-btn" aria-label="アレルギー設定">⚙</button>
  </header>

  <!-- 設定中のアレルギー表示 -->
  <div id="allergy-banner" class="allergy-banner"></div>

  <!-- メインの3つのボタン -->
  <main class="menu-area">

    <a href="test5.html" class="menu-btn-large">
      <span class="menu-text-title">アキネーター</span>
      <span class="menu-text-desc">気分や材料から今日の献立を絞り込む</span>
    </a>

    <a href="recipe.html" class="menu-btn-large recipe-card-theme">
      <span class="menu-text-title">レシピモード</span>
      <span class="menu-text-desc">登録済みの料理一覧から探す</span>
    </a>

    <a href="knowledge.html" class="menu-btn-large knowledge-card-theme">
      <span class="menu-text-title">豆知識</span>
      <span class="menu-text-desc">調理の基本と下ごしらえのコツ</span>
    </a>

  </main>

  <!-- ▼ アレルギー設定ポップアップカード ▼ -->
  <div id="setting-modal" class="modal-overlay">
    <div class="setting-card">
      <div class="setting-card-header">
        <h2>アレルギー食材の設定</h2>
        <button type="button" class="close-card-btn" id="close-setting-btn" aria-label="閉じる">×</button>
      </div>
      <div class="setting-card-body">
        <p class="setting-desc">チェックを入れた食材が含まれる料理には、検索結果に注意ラベルが表示されます。</p>
        <div class="allergy-grid" id="allergy-list">
          <label class="allergy-item"><input type="checkbox" value="卵"> 卵</label>
          <label class="allergy-item"><input type="checkbox" value="乳製品"> 乳製品</label>
          <label class="allergy-item"><input type="checkbox" value="小麦"> 小麦</label>
          <label class="allergy-item"><input type="checkbox" value="えび"> えび</label>
          <label class="allergy-item"><input type="checkbox" value="かに"> かに</label>
          <label class="allergy-item"><input type="checkbox" value="そば"> そば</label>
          <label class="allergy-item"><input type="checkbox" value="落花生"> 落花生</label>
          <label class="allergy-item"><input type="checkbox" value="大豆"> 大豆</label>
        </div>
        <button type="button" class="save-setting-btn" id="save-setting-btn">設定を保存する</button>
      </div>
    </div>
  </div>

  <script>
    // ハンバーガーメニュー開閉
    const hamburgerWrapper = document.getElementById('hamburger-wrapper');
    const hamburgerBtn = document.getElementById('hamburger-btn');

    hamburgerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      hamburgerWrapper.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!hamburgerWrapper.contains(e.target)) {
        hamburgerWrapper.classList.remove('open');
      }
    });

    // アレルギー設定カードの開閉と保存
    const settingModal = document.getElementById('setting-modal');
    const openSettingBtn = document.getElementById('open-setting-btn');
    const closeSettingBtn = document.getElementById('close-setting-btn');
    const saveSettingBtn = document.getElementById('save-setting-btn');
    const allergyBanner = document.getElementById('allergy-banner');
    const checkboxes = document.querySelectorAll('#allergy-list input[type="checkbox"]');

    function loadAllergies() {
      const saved = JSON.parse(localStorage.getItem('userAllergies') || '[]');
      checkboxes.forEach(cb => {
        cb.checked = saved.includes(cb.value);
      });
      updateAllergyBanner(saved);
    }

    function saveAllergies() {
      const selected = Array.from(checkboxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);
      localStorage.setItem('userAllergies', JSON.stringify(selected));
      updateAllergyBanner(selected);
    }

    function updateAllergyBanner(list) {
      if (list.length > 0) {
        allergyBanner.textContent = `アレルギー設定中：${list.join(' / ')}`;
        allergyBanner.classList.add('active');
      } else {
        allergyBanner.classList.remove('active');
      }
    }

    openSettingBtn.addEventListener('click', () => {
      settingModal.classList.add('open');
    });

    closeSettingBtn.addEventListener('click', () => {
      saveAllergies();
      settingModal.classList.remove('open');
    });

    saveSettingBtn.addEventListener('click', () => {
      saveAllergies();
      settingModal.classList.remove('open');
    });

    settingModal.addEventListener('click', (e) => {
      if (e.target === settingModal) {
        saveAllergies();
        settingModal.classList.remove('open');
      }
    });

    loadAllergies();
  </script>

</body>
</html>
