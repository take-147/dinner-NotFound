            width: 44px;
            height: 44px;
            font-size: 1.4rem;
            background-color: #ffffff;
            border: 2px solid #d69119;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #422b08;
            box-shadow: 0 2px 6px rgba(66, 43, 8, 0.08);
            transition: background-color 0.2s;
        }

        .hamburger-btn:hover {
            background-color: #fff0c2;
        }

        .nav-popup {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            padding-top: 8px;
            min-width: 215px;
            z-index: 201;
        }

        .hamburger-wrapper:hover .nav-popup,

        }

            background-color: #ffffff;
            border: 2px solid #d69119;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(66, 43, 8, 0.14);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .nav-popup-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 13px 16px;
            text-decoration: none;
            color: #422b08;
            font-size: 0.95rem;

            border-bottom: 1px solid #fef3c7;

            ['塩コショウ', '塩こしょう', '塩胡椒', 'しおこしょう'],
            ['ごま油', '胡麻油', 'ごまあぶら', 'sesame oil'],

            ['オイスターソース', 'oyster sauce']
        ];

        const foodCategories = {
            '豚肉': ['合挽き肉', 'ひき肉'],
            '牛肉': ['合挽き肉', 'ひき肉'],
            '鶏肉': ['ひき肉'],
            'ひき肉': ['合挽き肉'],
            '小麦粉': ['薄力粉'],
            '油': ['サラダ油', 'ごま油'],
            'こしょう': ['黒コショウ', '塩コショウ'],
            '塩': ['塩コショウ']
        };

        function normalize(text) {
            let result = String(text);
            result = result.normalize('NFKC');
            result = result.toLowerCase();
            result = result.trim();
            result = result.replace(/[ぁ-ゖ]/g, function (c) {
                return String.fromCharCode(c.charCodeAt(0) + 96);
            });
            result = result.replace(/\s+/g, '');
            return result;
        }

        function canonical(text) {
            const normalizedText = normalize(text);
            for (const group of foodDictionary) {
                const isMatch = group.some(word => normalize(word) === normalizedText);
                if (isMatch) {
                    return normalize(group[0]);
                }
            }
            return normalizedText;
        }

        function ingredientName(raw) {
            const text = String(raw).trim();
            if (!text || text.startsWith('[')) return '';
            return text.split(/\s+/)[0];
        }

        function matches(recipe, term) {
            const searchWord = canonical(term);
            if (!searchWord) return false;

            const searchWords = [searchWord];
            for (const category in foodCategories) {
                if (canonical(category) === searchWord) {
                    for (const food of foodCategories[category]) {
                        searchWords.push(canonical(food));
                    }
                }
            }

            const ingredients = (recipe.ingredients || []).map(raw => ingredientName(raw)).filter(Boolean);
            const tags = recipe.tags || [];
            const targets = [...ingredients, ...tags];

            return targets.some(function (name) {
                const foodName = canonical(name);
                return searchWords.includes(foodName);
            });
        }

        function renderChips() {
            const chips = $('chips');
            chips.replaceChildren();

            selected.forEach(function (food, index) {
                const button = document.createElement('button');
                button.className = 'chip';
                button.type = 'button';
                button.textContent = food + ' ×';
                button.onclick = function () {
                    selected.splice(index, 1);
                    renderChips();
                };
                chips.appendChild(button);
            });
        }

        function addIngredients() {
            const input = $('ingredient').value;
            const values = input.replaceAll('、', ',').replaceAll('，', ',').split(',');

            for (const value of values) {
                let food = value.trim();
                if (!food) continue;

                const foodName = canonical(food);
                if (foodName === canonical('豚肉')) food = '豚肉';
                else if (foodName === canonical('鶏肉')) food = '鶏肉';
                else if (foodName === canonical('牛肉')) food = '牛肉';

                const exists = selected.some(item => canonical(item) === canonical(food));
                if (!exists) {
                    selected.push(food);
                }
            }

            $('ingredient').value = '';
            renderChips();
        }

        $('add-form').onsubmit = function (event) {
            event.preventDefault();
            addIngredients();
        };

        $('reset-btn').onclick = function () {
            selected = [];
            aiFound = [];
            aiState = 'idle';
            $('ingredient').value = '';
            renderChips();
            if (!$('search-btn').disabled) {
                $('status').textContent = '';
            }
        };

        $('search-btn').onclick = function () {
            addIngredients();

            if (selected.length === 0) {
                $('status').textContent = '食材を1つ以上入力してください。';
                return;
            }

            $('status').textContent = '';
            found = [];
            aiFound = [];
            aiState = 'loading';
            currentSearchId++;

            for (const recipe of recipes) {
                const matched = [];
                for (const food of selected) {
                    if (matches(recipe, food)) {
                        matched.push(food);
                    }
                }
                if (matched.length > 0) {
                    found.push({ recipe: recipe, matched: matched });
                }
            }

            found.sort((a, b) => b.matched.length - a.matched.length);

            showResults();
            $('modal').classList.add('open');

            // 検索ボタンを押した時点で自動的にAI検索も実行
            fetchAiRecipes(currentSearchId);
        };

        function createElement(tag, text, className) {
            const element = document.createElement(tag);
            element.textContent = text || '';
            if (className) element.className = className;
            return element;
        }

        function createPhoto(recipe, className) {
            const img = document.createElement('img');
            img.src = recipe.image;
            img.alt = recipe.name;
            img.className = className;
            img.onerror = function () {
                img.style.display = 'none';
            };
            return img;
        }

        // 洗練された料理サムネイルアイコンを生成（ロボット絵文字の代わり）
        function createAiDishThumb() {
            const box = document.createElement('div');
            box.className = 'ai-dish-thumb';
            box.innerHTML = `
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
                    <path d="M7 2v20"/>
                    <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
                </svg>
                <span>RECIPE</span>
            `;
            return box;
        }

        // ★ 検索結果（AI提案を上、登録レシピを下に表示）
        function showResults() {
            const totalCount = aiFound.length + found.length;
            $('modal-title').textContent = aiState === 'loading'
                ? '検索結果（AIレシピ考案中...）'
                : '検索結果：' + totalCount + '件';

            const body = $('modal-body');
            body.replaceChildren();

            // 1. AIが生成したレシピ結果（上側に配置）
            if (aiState === 'loading') {
                body.appendChild(createElement('h3', '✨ AIが提案したレシピ', 'section-title'));
                const loadingBox = document.createElement('div');
                loadingBox.className = 'ai-loading-box';
                loadingBox.innerHTML = '<div class="spinner"></div><span>入力食材にぴったりの献立をAIが考案しています...</span>';
                body.appendChild(loadingBox);
            } else if (aiState === 'error') {
                body.appendChild(createElement('h3', '✨ AIが提案したレシピ', 'section-title'));
                const retryBtn = createElement('button', '⚠️ AI提案の取得に失敗しました（タップして再試行）', 'ai-retry-btn');
                retryBtn.type = 'button';
                retryBtn.onclick = function () {
                    aiState = 'loading';
                    showResults();
                    fetchAiRecipes(currentSearchId);
                };
                body.appendChild(retryBtn);
            } else if (aiFound.length > 0) {
                body.appendChild(createElement('h3', '✨ AIが提案したレシピ（' + aiFound.length + '件）', 'section-title'));
                for (const aiRecipe of aiFound) {
                    const card = createElement('button', '', 'recipe-card');
                    card.appendChild(createAiDishThumb());

                    const info = createElement('div', '', 'recipe-card-info');
                    const badge = createElement('span', 'AI提案', 'ai-badge');
                    const title = createElement('div', aiRecipe.name, 'recipe-card-title');
                    const summary = createElement('div', aiRecipe.summary, 'recipe-card-summary');
                    const matchedText = (aiRecipe.matched && aiRecipe.matched.length > 0)
                        ? '使用食材：' + aiRecipe.matched.join('・')
                        : '入力食材を活用';
                    const tags = createElement('div', matchedText, 'recipe-card-tags');

                    info.append(badge, title, summary, tags);
                    card.appendChild(info);
                    card.onclick = () => showDetail(aiRecipe, true);
                    body.appendChild(card);
                }
            }

            // 2. 登録済みJSONからの検索結果（下側に配置）
            if (found.length > 0) {
                body.appendChild(createElement('h3', '📖 登録レシピからの候補（' + found.length + '件）', 'section-title'));
                for (const item of found) {
                    const recipe = item.recipe;
                    const card = createElement('button', '', 'recipe-card');

                    if (recipe.image) {
                        card.appendChild(createPhoto(recipe, 'recipe-card-img'));
                    }

                    const info = createElement('div', '', 'recipe-card-info');
                    info.append(
                        createElement('div', recipe.name, 'recipe-card-title'),
                        createElement('div', recipe.summary, 'recipe-card-summary'),
                        createElement('div', item.matched.length + 'つ一致：' + item.matched.join('・'), 'recipe-card-tags')
                    );
                    card.appendChild(info);
                    card.onclick = () => showDetail(recipe, false);
                    body.appendChild(card);
                }
            } else if (aiState !== 'loading' && aiFound.length === 0) {
                body.appendChild(createElement('p', '条件に一致するレシピが見つかりませんでした。別の食材でお試しください。'));
            }

            document.querySelector('.modal-content').scrollTop = 0;
        }

        // ★ Cloudflare Workers 経由で Gemini API を自動呼び出し
        async function fetchAiRecipes(searchId) {
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ingredients: selected })
                });

                if (searchId !== currentSearchId) return; // 古い検索結果は無視

                if (!response.ok) {
                    throw new Error('通信エラー: ' + response.status);
                }

                const data = await response.json();
                if (searchId !== currentSearchId) return;

                if (data.recipes && Array.isArray(data.recipes)) {
                    aiFound = data.recipes;
                    aiState = 'done';
                    // 詳細画面を開いていなければ結果一覧を更新
                    if (!document.querySelector('.back-btn')) {
                        showResults();
                    }
                } else {
                    throw new Error('レシピデータの取得に失敗しました');
                }
            } catch (error) {
                if (searchId !== currentSearchId) return;
                console.error('AI検索エラー:', error);
                aiState = 'error';
                if (!document.querySelector('.back-btn')) {
                    showResults();
                }
            }
        }

        // ★ 料理の詳細画面（JSONデータ・AIデータ共通）
        function showDetail(recipe, isAi) {
            $('modal-title').textContent = recipe.name;

            const body = $('modal-body');
            body.replaceChildren();

            const back = createElement('button', '← 検索結果に戻る', 'back-btn');
            back.onclick = showResults;
            body.appendChild(back);

            if (!isAi && recipe.image) {
                body.appendChild(createPhoto(recipe, 'detail-img'));
            }

            if (isAi) {
                body.appendChild(createElement('span', 'AI提案レシピ', 'ai-badge'));
            }

            body.appendChild(createElement('p', recipe.summary));

            const q = encodeURIComponent(recipe.name);
            const linkBox = createElement('div', '', 'external-search-box');
            linkBox.innerHTML = `
                <a href="https://cookpad.com/jp/search/${q}" target="_blank" rel="noopener noreferrer" class="external-link-btn">🍳 クックパッドで検索</a>
                <a href="https://www.kurashiru.com/search?query=${q}" target="_blank" rel="noopener noreferrer" class="external-link-btn">🎬 クラシルで検索</a>
                <a href="https://delishkitchen.tv/search?q=${q}" target="_blank" rel="noopener noreferrer" class="external-link-btn">🥗 デリッシュキッチンで検索</a>
            `;
            body.appendChild(linkBox);

            body.appendChild(createElement('h3', '材料', 'section-title'));
            const ingredientsList = document.createElement('ul');
            if (recipe.ingredients && recipe.ingredients.length > 0) {
                for (const ingredient of recipe.ingredients) {
                    if (String(ingredient).trim()) {
                        ingredientsList.appendChild(createElement('li', ingredient));
                    }
                }
                body.appendChild(ingredientsList);
            } else {
                body.appendChild(createElement('p', '材料データがありません。上のレシピサイトボタンから確認できます。'));
            }

            body.appendChild(createElement('h3', '作り方', 'section-title'));
            const stepsList = document.createElement('ol');
            if (recipe.steps && recipe.steps.length > 0) {
                for (const step of recipe.steps) {
                    const trimmed = String(step).trim();
                    if (!trimmed) continue;

                    if (/^https?:\/\//.test(trimmed)) {
                        const li = document.createElement('li');
                        li.style.listStyle = 'none';
                        const link = document.createElement('a');
                        link.href = trimmed;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        link.textContent = '引用元レシピはこちら';
                        li.appendChild(link);
                        stepsList.appendChild(li);
                    } else {
                        stepsList.appendChild(createElement('li', step));
                    }
                }
                body.appendChild(stepsList);
            } else {
                body.appendChild(createElement('p', '作り方データがありません。上のレシピサイトボタンから確認できます。'));
            }

            document.querySelector('.modal-content').scrollTop = 0;
        }

        $('close-modal').onclick = () => $('modal').classList.remove('open');
        $('modal').onclick = function (event) {
            if (event.target === $('modal')) {
                $('modal').classList.remove('open');
            }
        };

        fetch('recipes.json')
            .then(response => response.json())
            .then(data => {
                recipes = data;
                $('search-btn').disabled = false;
                $('status').textContent = '';
            })
            .catch(error => {
                console.error('JSON読み込みエラー:', error);
                $('status').textContent = 'レシピデータの読み込みに失敗しました。';
            });
    </script>
</body>
</html>
